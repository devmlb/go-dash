name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        name: Build ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS Apple Silicon
                      runner: macos-latest
                      rust-target: aarch64-apple-darwin
                      args: --target aarch64-apple-darwin
                    - name: macOS Intel
                      runner: macos-latest
                      rust-target: x86_64-apple-darwin
                      args: --target x86_64-apple-darwin
                    - name: Linux x64
                      runner: ubuntu-latest
                      rust-target: x86_64-unknown-linux-gnu
                      args: --target x86_64-unknown-linux-gnu
                    - name: Linux ARM64
                      runner: ubuntu-24.04-arm
                      rust-target: aarch64-unknown-linux-gnu
                      args: --target aarch64-unknown-linux-gnu
                    - name: Windows classic x64
                      runner: windows-latest
                      rust-target: x86_64-pc-windows-msvc
                      args: --target x86_64-pc-windows-msvc
                    - name: Windows ARM64
                      runner: windows-11-arm
                      rust-target: aarch64-pc-windows-msvc
                      args: --target aarch64-pc-windows-msvc --bundles nsis

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust-target }}

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      curl \
                      file \
                      libayatana-appindicator3-dev \
                      libglib2.0-dev \
                      libgtk-3-dev \
                      libjavascriptcoregtk-4.1-dev \
                      libwebkit2gtk-4.1-dev \
                      libsoup-3.0-dev \
                      librsvg2-dev \
                      patchelf \
                      pkg-config \
                      xdg-utils \
                      wget

            - name: Install frontend dependencies
              run: npm ci

            - name: Build and upload Tauri release
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
              with:
                  tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
                  releaseName: v__VERSION__
                  releaseBody: This new version brings you Go Dash v__VERSION__, featuring bug fixes and improvements.
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
